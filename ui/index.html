<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>v2rayR</title>
    <script>
      // The window is recreated each time it leaves the tray; pick the theme
      // before first paint so a dark UI does not flash light while React boots.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("v2rayr.theme"); } catch (_) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
      function showBootError(text) {
        document.title = "ERR " + text;
        var root = document.getElementById("root");
        if (!root) return;
        root.textContent = "";
        var pre = document.createElement("pre");
        pre.style.cssText = "color:#a3372f;white-space:pre-wrap;padding:16px;font:13px monospace";
        pre.textContent = text;
        root.appendChild(pre);
      }
      window.addEventListener("error", (event) => {
        var where = event.filename ? event.filename + ":" + event.lineno + ":" + event.colno : "?";
        var stack = (event.error && event.error.stack) || "";
        showBootError("msg: " + event.message + "\nwhere: " + where + "\n" + stack);
      });
      window.addEventListener("unhandledrejection", (event) => {
        var reason = event.reason;
        showBootError("rejected: " + String((reason && reason.stack) || reason));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
