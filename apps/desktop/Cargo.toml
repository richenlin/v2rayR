[package]
name = "v2rayr-desktop"
description = "Tauri 2 desktop shell for v2rayR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Intentionally its own workspace: the Tauri dependency tree is large and
# platform specific, so `cargo test` of the crates stays fast while the shell is
# built by `cargo tauri build`. Because this manifest is a workspace root, the
# fields it inherits are declared here instead of the repository root.
[workspace]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/richenlin/v2rayR"

[lib]
name = "v2rayr_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
v2rayr-app = { path = "../../crates/app" }
v2rayr-domain = { path = "../../crates/domain" }
v2rayr-ipc = { path = "../../crates/ipc" }
v2rayr-platform = { path = "../../crates/platform" }
v2rayr-store = { path = "../../crates/store" }
uuid = { version = "1", features = ["serde", "v4"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

# The shell is its own workspace, so the root `[profile.release]` does not
# apply here. This binary is the one that stays resident.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
