[workspace]
resolver = "3"
members = ["crates/*", "apps/cli"]
# The Tauri shell is its own workspace: it pulls a large dependency tree that a
# headless CI runner can build but a plain `cargo test` should not have to.
exclude = ["apps/desktop"]
# `apps/desktop` needs the Tauri toolchain (and a GUI session) to build. It is
# always built in CI and by `cargo tauri build`, but not by a plain
# `cargo test`/`cargo clippy` of the workspace.
default-members = [
  "crates/domain",
  "crates/store",
  "crates/config",
  "crates/engine",
  "crates/platform",
  "crates/ipc",
  "crates/app",
  "crates/helper",
  "apps/cli",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/richenlin/v2rayR"
authors = ["v2rayR contributors"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
libc = "0.2"
percent-encoding = "2"
regex = "1"
# `gzip`/`charset` would pull `tower-http`, which is a poor trade for a client
# that fetches a handful of text documents. We simply do not advertise
# `Accept-Encoding: gzip`.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "http2",
  "default-tls",
] }
rusqlite = { version = "0.37", features = ["bundled"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
# `attributes` would pull trace-attributes (not in the offline cache); we do not
# need `#[instrument]`.
tracing = { version = "0.1", default-features = false, features = ["std"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
