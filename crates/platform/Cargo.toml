[package]
name = "v2rayr-platform"
description = "OS integration: system proxy takeover, autostart, port probing, app paths"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
tempfile.workspace = true
libc.workspace = true
tokio.workspace = true
v2rayr-domain = { path = "../domain" }

[target.'cfg(windows)'.dependencies]
base64.workspace = true
uuid.workspace = true
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console",
    "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
