[package]
name = "v2rayr-store"
description = "SQLite persistence for profiles, subscriptions, rules and traffic samples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Sealing payloads with AES-256-GCM needs `ring`, which the offline build image
# does not carry. CI builds with `--features sealed-payloads`; local builds fall
# back to plaintext JSON in a 0600 file (see docs/安全性.md).
sealed-payloads = ["dep:ring"]

[dependencies]
base64.workspace = true
chrono.workspace = true
ring = { version = "0.17", optional = true }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
tempfile.workspace = true
v2rayr-domain = { path = "../domain" }
