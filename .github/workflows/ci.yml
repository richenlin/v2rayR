name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust · fmt / clippy / test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: Test real Linux GSettings in an isolated session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 dconf-gsettings-backend gsettings-desktop-schemas
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_CURRENT_DESKTOP=GNOME GSETTINGS_BACKEND=dconf V2RAYR_TEST_GSETTINGS=1
          dbus-run-session -- cargo test -p v2rayr-platform --locked real_gsettings_round_trip -- --ignored
      - name: Verify HTTPS WebDAV conditional writes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked -p v2rayr-cli
          V2RAYR_TEST_CLI="$PWD/target/debug/v2rayr" python3 apps/cli/tests/fixtures/webdav_https.py
      - run: cargo build --workspace --release

  ui:
    name: ui · typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  desktop:
    name: desktop · tauri build
    # The Tauri shell lives in its own workspace; it is built here rather than in
    # the `rust` job so a broken desktop build never hides backend test results.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      # `beforeBuildCommand` would depend on the directory tauri-cli picks as
      # the project root, so the UI bundle is built explicitly instead.
      - run: pnpm --dir ui build
      - name: Prepare verified proxy cores
        shell: bash
        run: bash scripts/stage-desktop-cores.sh
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build --no-bundle
        if: github.event_name != 'workflow_dispatch'
        working-directory: apps/desktop
      - name: Build unsigned installers
        if: github.event_name == 'workflow_dispatch'
        run: cargo tauri build
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: v2rayR-unsigned-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/target/release/bundle/dmg/*.dmg
            apps/desktop/target/release/bundle/msi/*.msi
            apps/desktop/target/release/bundle/nsis/*.exe
            apps/desktop/target/release/bundle/deb/*.deb
            apps/desktop/target/release/bundle/rpm/*.rpm
            apps/desktop/target/release/bundle/appimage/*.AppImage
