name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust · fmt / clippy / test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: Test real Linux GSettings in an isolated session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 dconf-gsettings-backend gsettings-desktop-schemas
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_CURRENT_DESKTOP=GNOME GSETTINGS_BACKEND=dconf V2RAYR_TEST_GSETTINGS=1
          dbus-run-session -- cargo test -p v2rayr-platform --locked real_gsettings_round_trip -- --ignored
      - name: Verify HTTPS WebDAV conditional writes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked -p v2rayr-cli
          V2RAYR_TEST_CLI="$PWD/target/debug/v2rayr" python3 apps/cli/tests/fixtures/webdav_https.py
      - run: cargo build --workspace --release

  ui:
    name: ui · typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  desktop:
    name: desktop · compile
    # Pull requests only prove the shell compiles. Installers are built by the
    # package job after a merge to main.
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Compile the desktop app
        shell: bash
        run: bash scripts/package-desktop.sh --no-bundle

  package:
    name: desktop · package
    # Push covers merges into main. Tests must pass before installers are built.
    if: github.event_name != 'pull_request'
    needs: [rust, ui]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf file rpm libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build installers into dist/
        shell: bash
        run: bash scripts/package-desktop.sh
      - name: Verify the installed Windows TUN bundle
        timeout-minutes: 10
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-tun-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: v2rayR-${{ matrix.os }}
          if-no-files-found: error
          path: dist/*

  release:
    name: publish CI installers
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v2rayR-*
          path: release-artifacts
      - name: Publish verified installers as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          version=$(node -p 'require("./apps/desktop/tauri.conf.json").version')
          bash scripts/publish-ci-release.sh release-artifacts "$BUILD_SHA" "$version" "$BUILD_URL"
